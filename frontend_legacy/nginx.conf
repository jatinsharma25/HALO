server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The SPA owns its routes; anything that is not a file is the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API, so the browser needs no CORS and the token never
    # crosses an origin boundary.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # MJPEG is one endless response. Buffering would hold frames back until
        # nginx flushed, which reads as a stream that stutters or never starts.
        proxy_buffering off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
    }
}
