services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Both live under one mounted directory so a container restart keeps the
      # database AND the evidence. EVIDENCE_DIR previously defaulted to
      # ./evidence_clips while only ./evidence was mounted, so every packaged
      # clip was written inside the container and lost.
      DATABASE_URL: sqlite:////app/data/eyespy.db
      EVIDENCE_DIR: /app/data/evidence
    volumes:
      # Directories, not files: a bind mount whose source does not exist is
      # created by Docker as a DIRECTORY, which turns the SQLite file into an
      # unopenable directory on first run.
      - ./data:/app/data
      # Drop video files here and reference them as /app/media/<name> in a
      # camera's source URI.
      - ./media:/app/media:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
